name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e
